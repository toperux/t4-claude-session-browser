[package]
name = "claude-session-browser"
version = "0.2.8"
edition = "2021"
# `Option::is_none_or`; without this an older toolchain fails with an opaque
# "method not found" instead of a version message.
rust-version = "1.82"
description = "Browse, preview and delete Claude Code sessions - GUI, TUI and CLI in one binary"
license = "MIT"
repository = "https://github.com/toperux/t4-claude-session-browser"
readme = "README.md"
keywords = ["claude", "sessions", "cleanup", "tui", "gui"]

[[bin]]
name = "csb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
memchr = "2"
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ureq, not the default reqwest backend: this app has no async runtime and
# should not grow tokio+hyper just to fetch a release manifest. rustls keeps
# OpenSSL off the Linux build.
self_update = { version = "1.0.0-rc.6", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "progress-bar",
    "compression-zip-deflate",
    "compression-tar-gz",
] }
trash = "5"

[dev-dependencies]
tempfile = "3"

# Embeds assets/csb.ico as the exe resource, so Explorer, the taskbar and the
# installer's Start Menu shortcut all get the real icon.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2

# Linux packages, built by cargo-deb / cargo-generate-rpm in the release
# workflow. Both install the binary to /usr/bin plus a desktop entry and icon
# so the GUI shows up in application menus. The listed runtime libraries are
# what eframe's glow backend dlopens; the package tools only see DT_NEEDED, so
# they cannot find those on their own. `$auto` keeps the detected ones (a
# versioned libc6 in particular - the binary wants the builder's glibc).
[package.metadata.deb]
name = "csb"
maintainer = "Christopher Montevirgen"
copyright = "2026, Christopher Montevirgen"
section = "utils"
priority = "optional"
depends = "$auto, libgl1, libx11-6, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
assets = [
    ["target/release/csb", "usr/bin/", "755"],
    ["installer/csb.desktop", "usr/share/applications/", "644"],
    ["assets/csb.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/csb/", "644"],
]

# Fedora package names. openSUSE calls these libGL1 / libX11-6 / ..., so the
# rpm is Fedora-only until someone needs otherwise.
[package.metadata.generate-rpm]
name = "csb"
requires = { mesa-libGL = "*", libX11 = "*", libxkbcommon = "*", libxkbcommon-x11 = "*", libwayland-client = "*" }
assets = [
    { source = "target/release/csb", dest = "/usr/bin/csb", mode = "755" },
    { source = "installer/csb.desktop", dest = "/usr/share/applications/csb.desktop", mode = "644" },
    { source = "assets/csb.png", dest = "/usr/share/icons/hicolor/256x256/apps/csb.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/csb/README.md", mode = "644", doc = true },
]
